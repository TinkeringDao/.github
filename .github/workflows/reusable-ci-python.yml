name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to install"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Working directory for Python commands"
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "python -m pip install --upgrade pip && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi && if [ -f pyproject.toml ]; then pip install -e .; fi"
      lint-command:
        description: "Lint or syntax check command"
        required: false
        type: string
        default: "python -m compileall -q ."
      test-command:
        description: "Test execution command"
        required: false
        type: string
        default: "if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then python -m unittest discover; fi"

permissions:
  contents: read

jobs:
  python-ci:
    name: Python (${{ inputs.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Lint and syntax verification
        run: ${{ inputs.lint-command }}

      - name: Run test suite
        run: ${{ inputs.test-command }}
