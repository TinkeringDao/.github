name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install"
        required: false
        type: string
        default: "22"
      working-directory:
        description: "Working directory for Node.js commands"
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi"
      lint-command:
        description: "Lint / typecheck command"
        required: false
        type: string
        default: "if [ -f package.json ]; then npm run lint --if-present && npm run typecheck --if-present; fi"
      test-command:
        description: "Test execution command"
        required: false
        type: string
        default: "if [ -f package.json ]; then npm test --if-present; fi"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node-ci:
    name: Node.js (${{ inputs.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run lint and typecheck
        run: ${{ inputs.lint-command }}

      - name: Run tests
        run: ${{ inputs.test-command }}
