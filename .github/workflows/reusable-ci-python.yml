name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to install"
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: "Working directory for Python commands"
        required: false
        type: string
        default: "."
      install-command:
        description: "Dependency installation command"
        required: false
        type: string
        default: "python -m pip install --upgrade pip && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi && if [ -f pyproject.toml ]; then pip install -e .; fi"
      lint-command:
        description: "Lint or syntax check command"
        required: false
        type: string
        default: "python -m compileall -q ."
      test-command:
        description: "Test execution command"
        required: false
        type: string
        default: "if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then python -m unittest discover; fi"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-ci:
    name: Python (${{ inputs.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKING_DIR: ${{ inputs.working-directory }}
      INSTALL_CMD: ${{ inputs.install-command }}
      LINT_CMD: ${{ inputs.lint-command }}
      TEST_CMD: ${{ inputs.test-command }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "$WORKING_DIR"
          bash -eo pipefail -c "$INSTALL_CMD"

      - name: Lint and syntax verification
        run: |
          set -euo pipefail
          cd "$WORKING_DIR"
          bash -eo pipefail -c "$LINT_CMD"

      - name: Run test suite
        run: |
          set -euo pipefail
          cd "$WORKING_DIR"
          bash -eo pipefail -c "$TEST_CMD"
